version: '3.8'

services:
  mysql:
    image: mysql:8.0.33
    container_name: MySQL-Official
    environment:
      MYSQL_ROOT_PASSWORD: 123456789
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - D:/docker-hub/MySQL/Data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    ports:
      - "3307:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 300M
    depends_on:
      - mysql
